[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "food-hazard-baseline"
version = "0.1.0"
description = "Reproducible EDA, BERT focal-loss and Gemini baseline for SemEval-2025 Task 9"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "nltk>=3.9,<4",
  "torch>=2.6,<3", "transformers==4.57.6", "accelerate>=1.2,<2",
  "python-dotenv>=1.0,<2", "matplotlib>=3.9,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
food-baseline = "baseline.cli:main"

[tool.setuptools.packages.find]
include = ["baseline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
